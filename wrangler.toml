name = "mall-services"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# Workers AI (article writer) — no API key needed. Also add it in the dashboard if your project is dashboard-managed:
#   Workers & Pages → mall-services → Settings → Bindings → Add → Workers AI → Variable name: AI
[ai]
binding = "AI"

# This file is only needed if you deploy via `npx wrangler pages deploy .`
# If you connect the GitHub repo through the Cloudflare dashboard instead,
# you don't need this file at all — just set:
#   Build command:   (leave empty)
#   Build output directory: /
