<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لا يوجد اتصال — مول الخدمات</title>
  <meta name="robots" content="noindex,nofollow">

  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/offline.css">
</head>
<body>
  <main class="of" role="main">
    <div class="of-tile"><img width="128" height="128" src="/icons/logo-mark-128.webp" alt="مول الخدمات"></div>
    <h1 class="of-title">لا يوجد اتصال بالإنترنت</h1>
    <p class="of-text">تأكد من اتصالك بالشبكة وجرّب مرة تانية. الصفحات اللي فتحتها قبل كده ممكن تفتح من غير إنترنت.</p>
    <div class="of-actions">
      <button type="button" id="retry" class="of-btn of-primary">إعادة المحاولة</button>
      <a href="/" class="of-btn of-ghost">الصفحة الرئيسية</a>
    </div>
    <p id="status" class="of-status" role="status" aria-live="polite"></p>
  </main>
  <script src="/js/offline.js"></script>
