name = "mall-ai-daily-cron"
main = "index.js"
compatibility_date = "2024-01-01"

# Runs every day at 07:00 UTC (09:00 Cairo time).
[triggers]
crons = ["0 7 * * *"]

# Set your deployed Pages URL here, or better: keep it out of git and run
#   npx wrangler secret put SITE_URL
[vars]
SITE_URL = "https://your-site.pages.dev"

# ADMIN_SECRET must be set as a secret (matches the one on the Pages project):
#   npx wrangler secret put ADMIN_SECRET
